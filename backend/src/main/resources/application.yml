spring:
  application:
    name: Gendaz
  profiles:
    default: dev
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=100,expireAfterWrite=60s
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          lob:
            non_contextual_creation: true
  flyway:
    enabled: ${FLYWAY_ENABLED:false}

server:
  port: ${PORT:8080}

app:
  frontend-url: ${FRONTEND_URL:https://gendaz.site}
  admin-notification-email: ${ADMIN_NOTIFICATION_EMAIL:viniciushf0360@gmail.com}
  outbound-audit:
    enabled: ${OUTBOUND_AUDIT_ENABLED:false}
    summary-interval-ms: ${OUTBOUND_AUDIT_SUMMARY_INTERVAL_MS:600000}
  insights:
    cleanup-delay-ms: ${INSIGHTS_CLEANUP_DELAY_MS:3600000}
  audit-logs:
    retention-days: ${AUDIT_LOGS_RETENTION_DAYS:365}
    cleanup-delay-ms: ${AUDIT_LOGS_CLEANUP_DELAY_MS:86400000}

payment:
  provider: ${PAYMENT_PROVIDER:STRIPE}
  api-key: ${PAYMENT_API_KEY:}
  webhook-secret: ${PAYMENT_WEBHOOK_SECRET:}
  success-url: ${PAYMENT_SUCCESS_URL:https://gendaz.site/sistema/pagamento/sucesso}
  cancel-url: ${PAYMENT_CANCEL_URL:https://gendaz.site/sistema/planos}

stripe:
  secret-key: ${STRIPE_SECRET_KEY:}
  publishable-key: ${STRIPE_PUBLISHABLE_KEY:}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
  price-basico-id: ${STRIPE_PRICE_BASICO_ID:}
  price-pro-id: ${STRIPE_PRICE_PRO_ID:}



recaptcha:
  secret-key: ${RECAPTCHA_SECRET_KEY:}
  site-key: ${RECAPTCHA_SITE_KEY:}
  verify-url: https://www.google.com/recaptcha/api/siteverify

resend:
  api-key: ${RESEND_API_KEY:}
  from-email: ${RESEND_FROM_EMAIL:no-reply@gendaz.site}
  from-name: ${RESEND_FROM_NAME:Gendaz}

