name: Wake WhatsApp STAGE - Scheduler 15min

on:
  # Roda sozinho a cada 15 minutos.
  #
  # Horário de Brasília:
  # 05:07, 05:22, 05:37, 05:52...
  # até 18:52.
  #
  # Evitamos exatamente o minuto 00 para reduzir
  # chance de atraso por pico do GitHub Actions.
  schedule:
    - cron: "7,22,37,52 5-18 * * *"
      timezone: "America/Sao_Paulo"

  # Teste manual.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wake-whatsapp-stage-scheduler
  cancel-in-progress: false

jobs:
  check-and-wake:
    name: Verificar lembretes STAGE
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Identificar execução
        run: |
          set -euo pipefail

          echo "========================================"
          echo "WAKE WHATSAPP STAGE - SCHEDULER"
          echo "========================================"
          echo "Evento: ${GITHUB_EVENT_NAME}"
          echo "Branch/ref: ${GITHUB_REF_NAME}"
          echo ""
          echo "Este workflow está na MASTER somente como scheduler."
          echo "Todos os recursos utilizados são da STAGE."
          echo "Nenhum recurso PROD será chamado."

      - name: Instalar cliente PostgreSQL
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Verificar lembretes próximos no Neon STAGE
        id: due
        env:
          DB_URL: ${{ secrets.STAGE_SPRING_DATASOURCE_URL }}
          DB_USER: ${{ secrets.STAGE_SPRING_DATASOURCE_USERNAME }}
          DB_PASSWORD: ${{ secrets.STAGE_SPRING_DATASOURCE_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "${DB_URL:-}" ]; then
            echo "ERRO: STAGE_SPRING_DATASOURCE_URL não configurado."
            exit 1
          fi

          if [ -z "${DB_USER:-}" ]; then
            echo "ERRO: STAGE_SPRING_DATASOURCE_USERNAME não configurado."
            exit 1
          fi

          if [ -z "${DB_PASSWORD:-}" ]; then
            echo "ERRO: STAGE_SPRING_DATASOURCE_PASSWORD não configurado."
            exit 1
          fi

          DB_URL="${DB_URL#jdbc:}"

          export PGPASSWORD="$DB_PASSWORD"
          export PGCONNECT_TIMEOUT=15

          echo "========================================"
          echo "CONSULTANDO NEON STAGE"
          echo "========================================"
          echo "Backend STAGE e WPP STAGE ainda NÃO serão acordados."

          SQL="$(cat <<'SQL'
          WITH agora AS (
              SELECT CURRENT_TIMESTAMP AT TIME ZONE 'UTC' AS utc_now
          ),

          candidatos AS (

              /*
               * Lembretes normais PENDENTES.
               *
               * O horário efetivo considera scheduled_at
               * e next_attempt_at em caso de retry.
               */
              SELECT
                  GREATEST(
                      n.scheduled_at,
                      COALESCE(n.next_attempt_at, n.scheduled_at)
                  ) AS effective_due

              FROM whatsapp_notificacoes n
              CROSS JOIN agora a

              WHERE n.tipo = 'LEMBRETE_AGENDAMENTO'
                AND n.status = 'PENDENTE'

                AND n.recipient IS NOT NULL
                AND n.message_body IS NOT NULL
                AND n.scheduled_at IS NOT NULL

                /*
                 * Não considerar lembrete expirado.
                 */
                AND (
                    n.expires_at IS NULL
                    OR n.expires_at >= a.utc_now
                )

                /*
                 * Aceita até 10 minutos de atraso.
                 * Serve como margem caso o GitHub atrase.
                 */
                AND GREATEST(
                    n.scheduled_at,
                    COALESCE(n.next_attempt_at, n.scheduled_at)
                ) >= a.utc_now - INTERVAL '10 minutes'

                /*
                 * Procura os próximos 15 minutos.
                 *
                 * O GitHub roda a cada 15 minutos.
                 */
                AND GREATEST(
                    n.scheduled_at,
                    COALESCE(n.next_attempt_at, n.scheduled_at)
                ) <= a.utc_now + INTERVAL '15 minutes'

                /*
                 * Retry depois da expiração não deve acordar serviços.
                 */
                AND (
                    n.expires_at IS NULL
                    OR GREATEST(
                        n.scheduled_at,
                        COALESCE(n.next_attempt_at, n.scheduled_at)
                    ) <= n.expires_at
                )

              UNION ALL

              /*
               * Recuperação de mensagem que ficou presa
               * em ENVIANDO por mais de 120 segundos.
               *
               * Nesse caso o wake deve acontecer imediatamente.
               */
              SELECT
                  a.utc_now AS effective_due

              FROM whatsapp_notificacoes n
              CROSS JOIN agora a

              WHERE n.tipo = 'LEMBRETE_AGENDAMENTO'
                AND n.status = 'ENVIANDO'

                AND n.recipient IS NOT NULL
                AND n.message_body IS NOT NULL

                AND n.processing_started_at IS NOT NULL

                AND n.processing_started_at <=
                    a.utc_now - INTERVAL '120 seconds'

                AND (
                    n.expires_at IS NULL
                    OR n.expires_at >= a.utc_now
                )
          )

          SELECT
              COUNT(*),
              COALESCE(
                  EXTRACT(
                      EPOCH FROM (
                          MIN(effective_due) AT TIME ZONE 'UTC'
                      )
                  )::BIGINT,
                  0
              )
          FROM candidatos;
          SQL
          )"

          RESULT="$(psql \
            "$DB_URL" \
            -U "$DB_USER" \
            -v ON_ERROR_STOP=1 \
            -Atq \
            -F "|" \
            -c "$SQL")"

          COUNT="${RESULT%%|*}"
          DUE_EPOCH="${RESULT##*|}"

          COUNT="$(echo "$COUNT" | tr -d '[:space:]')"
          DUE_EPOCH="$(echo "$DUE_EPOCH" | tr -d '[:space:]')"

          if ! [[ "$COUNT" =~ ^[0-9]+$ ]]; then
            echo "ERRO: quantidade de lembretes inválida."
            exit 1
          fi

          if ! [[ "$DUE_EPOCH" =~ ^[0-9]+$ ]]; then
            echo "ERRO: horário retornado pelo banco inválido."
            exit 1
          fi

          echo ""
          echo "========================================"
          echo "RESULTADO DA CONSULTA"
          echo "========================================"
          echo "Lembretes encontrados: $COUNT"
          echo "Próximo horário epoch: $DUE_EPOCH"

          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "due_epoch=$DUE_EPOCH" >> "$GITHUB_OUTPUT"

      - name: Nenhum lembrete próximo
        if: steps.due.outputs.count == '0'
        run: |
          echo "========================================"
          echo "NENHUM LEMBRETE PRÓXIMO"
          echo "========================================"
          echo "WPP Service STAGE NÃO será acordado."
          echo "Backend Gendaz STAGE NÃO será acordado."
          echo "Fim da execução."

      - name: Aguardar janela de wake
        if: steps.due.outputs.count != '0'
        env:
          DUE_EPOCH: ${{ steps.due.outputs.due_epoch }}
        run: |
          set -euo pipefail

          NOW_EPOCH="$(date -u +%s)"

          # Queremos iniciar o cold start aproximadamente
          # 5 minutos antes do horário real do lembrete.
          WAKE_EPOCH=$((DUE_EPOCH - 300))
          WAIT_SECONDS=$((WAKE_EPOCH - NOW_EPOCH))

          echo "========================================"
          echo "LEMBRETE ENCONTRADO"
          echo "========================================"
          echo "Agora: ${NOW_EPOCH}"
          echo "Lembrete: ${DUE_EPOCH}"
          echo "Wake planejado: ${WAKE_EPOCH}"

          if [ "$WAIT_SECONDS" -le 0 ]; then
            echo ""
            echo "Já estamos dentro da janela de wake."
            echo "Serviços serão acordados agora."
            exit 0
          fi

          echo ""
          echo "Aguardando ${WAIT_SECONDS} segundos antes do wake."
          echo "WPP e Backend continuam dormindo durante essa espera."

          sleep "$WAIT_SECONDS"

          echo ""
          echo "Janela de wake atingida."

      - name: Acordar WPP Service STAGE
        if: steps.due.outputs.count != '0'
        run: |
          set -euo pipefail

          URL="https://whatsapp-service-s3f2.onrender.com/health"

          echo "========================================"
          echo "ACORDANDO WPP SERVICE STAGE"
          echo "========================================"

          for tentativa in $(seq 1 15); do

            HTTP_CODE="$(curl \
              -sS \
              -o /tmp/wpp-health.json \
              -w "%{http_code}" \
              --connect-timeout 8 \
              --max-time 15 \
              "$URL" || true)"

            echo "Tentativa ${tentativa}/15 - HTTP ${HTTP_CODE:-000}"

            if [ "$HTTP_CODE" = "200" ]; then
              echo ""
              echo "WPP Service STAGE está ONLINE."
              cat /tmp/wpp-health.json || true
              exit 0
            fi

            sleep 8
          done

          echo ""
          echo "ERRO: WPP Service STAGE não ficou saudável."
          exit 1

      - name: Aguardar restauração da sessão WhatsApp
        if: steps.due.outputs.count != '0'
        run: |
          echo "========================================"
          echo "AGUARDANDO SESSÃO WHATSAPP"
          echo "========================================"
          echo "Aguardando restauração automática da sessão..."

          sleep 20

          echo "Espera concluída."

      - name: Acordar Backend Gendaz STAGE
        if: steps.due.outputs.count != '0'
        run: |
          set -euo pipefail

          URL="https://gendaz-stage.onrender.com/api/health"

          echo "========================================"
          echo "ACORDANDO BACKEND GENDAZ STAGE"
          echo "========================================"

          for tentativa in $(seq 1 15); do

            HTTP_CODE="$(curl \
              -sS \
              -o /tmp/backend-health.json \
              -w "%{http_code}" \
              --connect-timeout 8 \
              --max-time 15 \
              "$URL" || true)"

            echo "Tentativa ${tentativa}/15 - HTTP ${HTTP_CODE:-000}"

            if [ "$HTTP_CODE" = "200" ]; then
              echo ""
              echo "Backend Gendaz STAGE está ONLINE."
              cat /tmp/backend-health.json || true
              exit 0
            fi

            sleep 8
          done

          echo ""
          echo "ERRO: Backend Gendaz STAGE não ficou saudável."
          exit 1

      - name: Wake STAGE concluído
        if: steps.due.outputs.count != '0'
        run: |
          echo "========================================"
          echo "WAKE STAGE CONCLUÍDO"
          echo "========================================"
          echo "Lembretes encontrados: ${{ steps.due.outputs.count }}"
          echo ""
          echo "WPP Service STAGE: ONLINE"
          echo "Backend Gendaz STAGE: ONLINE"
          echo ""
          echo "O scheduler Java agora assume o processamento."
          echo "O GitHub Actions NÃO envia a mensagem diretamente."
          echo "O GitHub Actions NÃO mantém os serviços acordados."
