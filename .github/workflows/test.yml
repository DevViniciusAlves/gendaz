name: Testes Backend

on:
  push:
    branches:
      - main
      - stage

  pull_request:
    branches:
      - main
      - stage

  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Rodar testes
        working-directory: backend
        run: mvn --batch-mode clean test

      - name: Criar Issue se os testes falharem
        if: failure()
        run: |
          gh issue create \
            --title "🐛 Testes automáticos do backend falharam" \
            --body "O GitHub Actions encontrou uma falha nos testes do backend.

            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}

            Verifique a execução do GitHub Actions para identificar o erro."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}