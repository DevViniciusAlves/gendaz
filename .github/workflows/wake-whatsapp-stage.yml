name: Wake WhatsApp STAGE - Lembretes

on:
  # TESTE SOMENTE NA STAGE.
  # Sempre que este arquivo for alterado na stage,
  # o workflow executa.
  push:
    branches:
      - stage
    paths:
      - '.github/workflows/wake-whatsapp-stage.yml'

concurrency:
  group: wake-whatsapp-stage
  cancel-in-progress: false

jobs:
  check-and-wake:
    name: Verificar lembretes e acordar STAGE
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Validar branch
        run: |
          set -euo pipefail

          echo "Branch atual: ${GITHUB_REF_NAME}"
          echo "Evento: ${GITHUB_EVENT_NAME}"

          if [ "${GITHUB_REF_NAME}" != "stage" ]; then
            echo "ERRO: este workflow deve executar somente na branch stage."
            exit 1
          fi

          echo "Branch STAGE validada."

      - name: Instalar cliente PostgreSQL
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Verificar lembretes próximos no Neon STAGE
        id: due
        env:
          DB_URL: ${{ secrets.STAGE_SPRING_DATASOURCE_URL }}
          DB_USER: ${{ secrets.STAGE_SPRING_DATASOURCE_USERNAME }}
          DB_PASSWORD: ${{ secrets.STAGE_SPRING_DATASOURCE_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "${DB_URL:-}" ]; then
            echo "ERRO: STAGE_SPRING_DATASOURCE_URL não configurado."
            exit 1
          fi

          if [ -z "${DB_USER:-}" ]; then
            echo "ERRO: STAGE_SPRING_DATASOURCE_USERNAME não configurado."
            exit 1
          fi

          if [ -z "${DB_PASSWORD:-}" ]; then
            echo "ERRO: STAGE_SPRING_DATASOURCE_PASSWORD não configurado."
            exit 1
          fi

          # Converte:
          # jdbc:postgresql://...
          # para:
          # postgresql://...
          DB_URL="${DB_URL#jdbc:}"

          export PGPASSWORD="$DB_PASSWORD"
          export PGCONNECT_TIMEOUT=15

          echo "Conectando no Neon STAGE..."

          SQL="$(cat <<'SQL'
          WITH agora AS (
              SELECT CURRENT_TIMESTAMP AT TIME ZONE 'UTC' AS utc_now
          )
          SELECT COUNT(*)
          FROM whatsapp_notificacoes n
          CROSS JOIN agora a
          WHERE n.tipo = 'LEMBRETE_AGENDAMENTO'
            AND n.recipient IS NOT NULL
            AND n.message_body IS NOT NULL
            AND (
                n.expires_at IS NULL
                OR n.expires_at >= a.utc_now
            )
            AND (
                (
                    n.status = 'PENDENTE'
                    AND n.scheduled_at IS NOT NULL
                    AND n.scheduled_at <= a.utc_now + INTERVAL '5 minutes'
                    AND (
                        n.next_attempt_at IS NULL
                        OR n.next_attempt_at <= a.utc_now + INTERVAL '5 minutes'
                    )
                )
                OR
                (
                    n.status = 'ENVIANDO'
                    AND n.processing_started_at IS NOT NULL
                    AND n.processing_started_at <= a.utc_now - INTERVAL '120 seconds'
                )
            );
          SQL
          )"

          COUNT="$(psql \
            "$DB_URL" \
            -U "$DB_USER" \
            -v ON_ERROR_STOP=1 \
            -Atq \
            -c "$SQL")"

          COUNT="$(echo "$COUNT" | tr -d '[:space:]')"

          if ! [[ "$COUNT" =~ ^[0-9]+$ ]]; then
            echo "ERRO: retorno inválido da consulta."
            exit 1
          fi

          echo "Lembretes encontrados: $COUNT"
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

      - name: Nenhum lembrete próximo
        if: steps.due.outputs.count == '0'
        run: |
          echo "========================================"
          echo "NENHUM LEMBRETE PRÓXIMO"
          echo "========================================"
          echo "Não existe lembrete que precise ser processado agora."
          echo "WPP e Backend STAGE podem continuar hibernados."

      - name: Acordar WPP Service STAGE
        if: steps.due.outputs.count != '0'
        run: |
          set -euo pipefail

          URL="https://whatsapp-service-s3f2.onrender.com/health"

          echo "========================================"
          echo "ACORDANDO WPP SERVICE STAGE"
          echo "========================================"

          for tentativa in $(seq 1 15); do

            HTTP_CODE="$(curl \
              -sS \
              -o /tmp/wpp-health.json \
              -w "%{http_code}" \
              --connect-timeout 8 \
              --max-time 15 \
              "$URL" || true)"

            echo "Tentativa ${tentativa}/15 - HTTP ${HTTP_CODE:-000}"

            if [ "$HTTP_CODE" = "200" ]; then
              echo "WPP Service STAGE está ONLINE."
              cat /tmp/wpp-health.json || true
              exit 0
            fi

            sleep 8
          done

          echo "ERRO: WPP Service STAGE não ficou saudável."
          exit 1

      - name: Aguardar restauração da sessão WhatsApp
        if: steps.due.outputs.count != '0'
        run: |
          echo "Aguardando restauração automática das sessões WhatsApp..."
          sleep 20

      - name: Acordar Backend STAGE
        if: steps.due.outputs.count != '0'
        run: |
          set -euo pipefail

          URL="https://gendaz-stage.onrender.com/api/health"

          echo "========================================"
          echo "ACORDANDO BACKEND STAGE"
          echo "========================================"

          for tentativa in $(seq 1 15); do

            HTTP_CODE="$(curl \
              -sS \
              -o /tmp/backend-health.json \
              -w "%{http_code}" \
              --connect-timeout 8 \
              --max-time 15 \
              "$URL" || true)"

            echo "Tentativa ${tentativa}/15 - HTTP ${HTTP_CODE:-000}"

            if [ "$HTTP_CODE" = "200" ]; then
              echo "Backend STAGE está ONLINE."
              cat /tmp/backend-health.json || true
              exit 0
            fi

            sleep 8
          done

          echo "ERRO: Backend STAGE não ficou saudável."
          exit 1

      - name: Wake STAGE concluído
        if: steps.due.outputs.count != '0'
        run: |
          echo "========================================"
          echo "WAKE STAGE CONCLUÍDO COM SUCESSO"
          echo "========================================"
          echo "Lembretes encontrados: ${{ steps.due.outputs.count }}"
          echo "WPP Service: ONLINE"
          echo "Backend STAGE: ONLINE"
          echo "O scheduler Java agora assume o processamento."
