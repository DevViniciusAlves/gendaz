name: Wake WhatsApp STAGE - Lembretes

on:
  # Automático: a cada 15 minutos,
  # somente entre 05:00 e 19:00 no horário de Brasília.
  #
  # Começa em :05 para evitar o pico de workflows
  # exatamente no início da hora.
  schedule:
    - cron: "5-59/15 5-18 * * *"
      timezone: "America/Sao_Paulo"

    # Última verificação do dia.
    - cron: "0 19 * * *"
      timezone: "America/Sao_Paulo"

  # Permite teste manual quando STAGE for a default branch.
  workflow_dispatch:

  # Mantém o teste imediato:
  # alterou este próprio workflow na stage -> executa uma vez.
  push:
    branches:
      - stage
    paths:
      - ".github/workflows/wake-whatsapp-stage.yml"

concurrency:
  group: wake-whatsapp-stage
  cancel-in-progress: false

jobs:
  check-and-wake:
    name: Verificar lembretes e acordar STAGE
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Validar ambiente STAGE
        run: |
          set -euo pipefail

          echo "Branch/ref atual: ${GITHUB_REF_NAME}"
          echo "Evento: ${GITHUB_EVENT_NAME}"

          # Em push queremos obrigatoriamente a branch stage.
          if [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "${GITHUB_REF_NAME}" != "stage" ]; then
            echo "ERRO: push permitido somente na branch stage."
            exit 1
          fi

          echo "Ambiente STAGE validado."

      - name: Instalar cliente PostgreSQL
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Verificar lembretes próximos no Neon STAGE
        id: due
        env:
          DB_URL: ${{ secrets.STAGE_SPRING_DATASOURCE_URL }}
          DB_USER: ${{ secrets.STAGE_SPRING_DATASOURCE_USERNAME }}
          DB_PASSWORD: ${{ secrets.STAGE_SPRING_DATASOURCE_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "${DB_URL:-}" ]; then
            echo "ERRO: STAGE_SPRING_DATASOURCE_URL não configurado."
            exit 1
          fi

          if [ -z "${DB_USER:-}" ]; then
            echo "ERRO: STAGE_SPRING_DATASOURCE_USERNAME não configurado."
            exit 1
          fi

          if [ -z "${DB_PASSWORD:-}" ]; then
            echo "ERRO: STAGE_SPRING_DATASOURCE_PASSWORD não configurado."
            exit 1
          fi

          # jdbc:postgresql://...
          # vira:
          # postgresql://...
          DB_URL="${DB_URL#jdbc:}"

          export PGPASSWORD="$DB_PASSWORD"
          export PGCONNECT_TIMEOUT=15

          echo "Conectando somente no Neon STAGE..."
          echo "WPP Service e Backend NÃO serão chamados durante esta consulta."

          SQL="$(cat <<'SQL'
          WITH agora AS (
              SELECT CURRENT_TIMESTAMP AT TIME ZONE 'UTC' AS utc_now
          )
          SELECT COUNT(*)
          FROM whatsapp_notificacoes n
          CROSS JOIN agora a
          WHERE n.tipo = 'LEMBRETE_AGENDAMENTO'

            AND n.recipient IS NOT NULL
            AND n.message_body IS NOT NULL

            -- Não acordar serviço por lembrete já expirado.
            AND (
                n.expires_at IS NULL
                OR n.expires_at >= a.utc_now
            )

            AND (
                (
                    -- Lembrete normal pendente.
                    n.status = 'PENDENTE'

                    AND n.scheduled_at IS NOT NULL

                    -- Não considerar lembrete antigo perdido.
                    AND n.scheduled_at >=
                        a.utc_now - INTERVAL '10 minutes'

                    -- Acordamos no máximo 12 minutos antes.
                    -- Como o workflow roda a cada 15 min,
                    -- isso deixa uma margem máxima aproximada
                    -- de 3 minutos entre as verificações.
                    AND n.scheduled_at <=
                        a.utc_now + INTERVAL '12 minutes'

                    -- Retry ainda precisa estar próximo.
                    AND (
                        n.next_attempt_at IS NULL
                        OR n.next_attempt_at <=
                            a.utc_now + INTERVAL '12 minutes'
                    )
                )

                OR

                (
                    -- Recuperação de envio preso/crash.
                    n.status = 'ENVIANDO'

                    AND n.processing_started_at IS NOT NULL

                    AND n.processing_started_at <=
                        a.utc_now - INTERVAL '120 seconds'

                    AND (
                        n.scheduled_at IS NULL
                        OR n.scheduled_at >=
                            a.utc_now - INTERVAL '10 minutes'
                    )
                )
            );
          SQL
          )"

          COUNT="$(psql \
            "$DB_URL" \
            -U "$DB_USER" \
            -v ON_ERROR_STOP=1 \
            -Atq \
            -c "$SQL")"

          COUNT="$(echo "$COUNT" | tr -d '[:space:]')"

          if ! [[ "$COUNT" =~ ^[0-9]+$ ]]; then
            echo "ERRO: retorno inválido da consulta."
            exit 1
          fi

          echo "========================================"
          echo "Lembretes encontrados: $COUNT"
          echo "========================================"

          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

      - name: Nenhum lembrete próximo
        if: steps.due.outputs.count == '0'
        run: |
          echo "========================================"
          echo "NENHUM LEMBRETE PRÓXIMO"
          echo "========================================"
          echo "Nenhum serviço Render será acordado."
          echo "Backend STAGE pode continuar dormindo."
          echo "WPP Service pode continuar dormindo."
          echo "Fim."

      # O WPP é acordado primeiro propositalmente.
      # Assim damos tempo para Baileys restaurar a sessão
      # antes de ligar o scheduler Java do Backend.
      - name: Acordar WPP Service STAGE
        if: steps.due.outputs.count != '0'
        run: |
          set -euo pipefail

          URL="https://whatsapp-service-s3f2.onrender.com/health"

          echo "========================================"
          echo "LEMBRETE ENCONTRADO"
          echo "ACORDANDO WPP SERVICE STAGE"
          echo "========================================"

          for tentativa in $(seq 1 15); do

            HTTP_CODE="$(curl \
              -sS \
              -o /tmp/wpp-health.json \
              -w "%{http_code}" \
              --connect-timeout 8 \
              --max-time 15 \
              "$URL" || true)"

            echo "Tentativa ${tentativa}/15 - HTTP ${HTTP_CODE:-000}"

            if [ "$HTTP_CODE" = "200" ]; then
              echo "WPP Service STAGE está ONLINE."
              cat /tmp/wpp-health.json || true
              exit 0
            fi

            sleep 8
          done

          echo "ERRO: WPP Service STAGE não ficou saudável."
          exit 1

      - name: Aguardar restauração da sessão WhatsApp
        if: steps.due.outputs.count != '0'
        run: |
          echo "Aguardando restauração automática da sessão WhatsApp..."
          sleep 20

      - name: Acordar Backend STAGE
        if: steps.due.outputs.count != '0'
        run: |
          set -euo pipefail

          URL="https://gendaz-stage.onrender.com/api/health"

          echo "========================================"
          echo "ACORDANDO BACKEND STAGE"
          echo "========================================"

          for tentativa in $(seq 1 15); do

            HTTP_CODE="$(curl \
              -sS \
              -o /tmp/backend-health.json \
              -w "%{http_code}" \
              --connect-timeout 8 \
              --max-time 15 \
              "$URL" || true)"

            echo "Tentativa ${tentativa}/15 - HTTP ${HTTP_CODE:-000}"

            if [ "$HTTP_CODE" = "200" ]; then
              echo "Backend STAGE está ONLINE."
              cat /tmp/backend-health.json || true
              exit 0
            fi

            sleep 8
          done

          echo "ERRO: Backend STAGE não ficou saudável."
          exit 1

      - name: Wake STAGE concluído
        if: steps.due.outputs.count != '0'
        run: |
          echo "========================================"
          echo "WAKE STAGE CONCLUÍDO"
          echo "========================================"
          echo "Lembretes encontrados: ${{ steps.due.outputs.count }}"
          echo "WPP Service: ONLINE"
          echo "Backend STAGE: ONLINE"
          echo ""
          echo "A partir daqui o scheduler Java assume."
          echo "O GitHub Actions não envia a mensagem."
          echo "O GitHub Actions não mantém os serviços acordados."
