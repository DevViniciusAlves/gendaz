name: Keep Alive - Render

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: keep-alive-render
  cancel-in-progress: false

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping backend
        run: |
          echo "Pinging backend..."
          curl -fsS --max-time 30 --retry 2 --retry-delay 5 \
            https://api.gendaz.site/health
          echo "Backend OK"

      - name: Ping whatsapp-service
        run: |
          echo "Pinging whatsapp-service..."
          curl -fsS --max-time 30 --retry 2 --retry-delay 5 \
            https://wpp-serice.onrender.com/health
          echo "WhatsApp service OK"
