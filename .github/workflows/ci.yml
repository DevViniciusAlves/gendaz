name: CI - Gendaz Homologacao e Release

on:
  push:
    branches:
      - stage
      - master
  pull_request:
    branches:
      - master

jobs:
  backend-build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: testdb
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build and Test Backend with Maven (Unit & Integration Tests)
        env:
          JWT_SECRET: super_secret_key_for_jwt_tokens_testing_123456789
          SUPER_ADMIN_PASSWORD: super_secret_admin_pass_123456789
          SPRING_PROFILES_ACTIVE: test
        run: |
          cd backend
          mvn clean verify -B

  frontend-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies & Build Frontend
        run: |
          cd frontend
          npm ci
          npm run build
