name: CI
on: [push, pull_request]

jobs:
  backend-build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "Backend build and test"

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "Frontend build"

  whatsapp-service-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: whatsapp-service/package-lock.json

      - name: Install WhatsApp Service dependencies
        working-directory: whatsapp-service
        run: npm ci

      - name: Run WhatsApp Service tests
        working-directory: whatsapp-service
        run: npm test
